index_col: customer_id
target_col: target

one_hot_drop: if_binary
auto_class_weights: Balanced

n_splits: 5
metrics:
  - f1
  - roc_auc
n_jobs: -1

retrain: true

preprocessing:
  categorical_encoder: onehot

model:
  estimator: logistic_regression
  C: 1
  penalty: l2
  solver: liblinear
  random_state: 42
